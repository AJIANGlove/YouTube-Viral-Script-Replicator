<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原文对照</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  header { background: #1f2937; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 20; }
  header .back { color: #9ca3af; text-decoration: none; font-size: 13px; white-space: nowrap; padding: 4px 10px; border: 1px solid #4b5563; border-radius: 5px; }
  header .back:hover { color: #fff; border-color: #9ca3af; }
  header .titles { min-width: 0; max-width: calc(100% - 240px); }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }
  /* 复制按钮:沿用 .ghost 白底样式,紧跟标题区右侧(页面中段),不再贴最右(2026-11-05) */
  header .actions { display: flex; gap: 8px; flex-shrink: 0; }
  /* 副标题:中文译名只读,英文原名可点击复制(2026-11-05 口径) */
  .sub-zh { color: #9ca3af; }
  .sub-sep { color: #6b7280; }
  .sub-en { font: inherit; color: #e5e7eb; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; text-decoration: underline dotted #6b7280; text-underline-offset: 3px; }
  .sub-en:hover { color: #93c5fd; text-decoration: underline solid #93c5fd; }
  .sub-en:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; border-radius: 2px; }
  .sub-status { margin-left: 8px; font-size: 11px; color: #34d399; }
  .sub-status.error { color: #f87171; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 22px; }
  .cue { display: grid; grid-template-columns: 118px 1fr 1fr; gap: 14px; padding: 8px 0; border-bottom: 1px solid #f3f4f6; }
  .cue:last-child { border-bottom: none; }
  .cue .time { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: #9ca3af; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .cue .en { font-size: 14px; line-height: 1.7; color: #1f2937; }
  .cue .zh { font-size: 13px; line-height: 1.7; color: #6b7280; border-left: 1px solid #e5e7eb; padding-left: 14px; }
  .hint { color: #9ca3af; font-size: 13px; text-align: center; padding: 40px 0; }
  .total { font-size: 12px; color: #9ca3af; text-align: center; padding: 12px 0 4px; }
  button.ghost { padding: 6px 12px; background: #fff; color: #374151; border: 1px solid #d1d5db; border-radius: 5px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  button.ghost:hover:not(:disabled) { border-color: #9ca3af; }
  button.ghost:disabled { opacity: .45; cursor: default; }
  @media (max-width: 760px) {
    header { flex-wrap: wrap; }
    header .titles { max-width: 100%; flex: 1; }
    header .actions { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <a class="back" href="/">← 返回资产库</a>
  <div class="titles">
    <h1 id="title">原文对照</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="actions">
    <button type="button" class="ghost" id="btnCopyScript" onclick="copyScript(this)" disabled>复制文案</button>
    <button type="button" class="ghost" id="btnCopyTitleScript" onclick="copyTitleScript(this)" disabled>复制标题+文案</button>
  </div>
</header>
<main>
  <div class="card" id="content"><div class="hint">加载中…</div></div>
  <div class="total" id="total"></div>
</main>
<script>
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtT(t) { return (t || '').replace(',', '.').slice(0, 12); }

// 复制文案 = source.srt 英文正文,去时间轴;整篇用单空格连接(2026-11-05 口径)
let scriptText = '';
// 标题 = meta.source_title(英文原名),不含中文译名
let titleText = '';
let titleStatusTimer = null;

// 复制:优先 Clipboard API(安全上下文),否则回退 textarea + execCommand(局域网 HTTP 环境)
function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

async function doCopy(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { return legacyCopy(text); }
  }
  return legacyCopy(text);
}

function flashButton(btn, ok) {
  const label = btn.dataset.label || btn.textContent;
  btn.dataset.label = label;
  btn.textContent = ok ? '已复制 ✓' : '复制失败';
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = label;
    btn.disabled = !scriptText;
  }, 1500);
}

async function copyScript(btn) {
  if (!scriptText) return;
  const ok = await doCopy(scriptText);
  flashButton(btn, ok);
  if (!ok) alert('复制失败,请手动全选文本复制');
}

async function copyTitleScript(btn) {
  if (!scriptText) return;
  const text = titleText ? titleText + '\n\n' + scriptText : scriptText;
  const ok = await doCopy(text);
  flashButton(btn, ok);
  if (!ok) alert('复制失败,请手动全选文本复制');
}

function resetTitleStatus() {
  if (titleStatusTimer !== null) { clearTimeout(titleStatusTimer); titleStatusTimer = null; }
  const el = document.getElementById('subTitleStatus');
  if (el) { el.textContent = ''; el.classList.remove('error'); }
}

async function copyTitle() {
  if (!titleText) return;
  const ok = await doCopy(titleText);
  const el = document.getElementById('subTitleStatus');
  if (!el) return;
  resetTitleStatus();
  el.textContent = ok ? '已复制 ✓' : '复制失败';
  el.classList.toggle('error', !ok);
  titleStatusTimer = setTimeout(resetTitleStatus, 1500);
  if (!ok) alert('标题复制失败,请检查浏览器剪贴板权限后重试');
}

// 副标题:中文译名只做展示,英文原名可点击复制
function renderSubtitle(r) {
  const zh = String(r.source_title_zh || '').trim();
  const en = String(r.source_title || '').trim();
  titleText = en;
  document.getElementById('subtitle').innerHTML =
    (zh ? `<span class="sub-zh">${esc(zh)}</span>` : '') +
    (en ? (zh ? '<span class="sub-sep"> · </span>' : '') +
      `<button type="button" class="sub-en" id="subTitle" title="点击复制标题" onclick="copyTitle()">${esc(en)}</button>` +
      '<span class="sub-status" id="subTitleStatus" role="status" aria-live="polite"></span>' : '');
}

async function load() {
  const id = new URLSearchParams(location.search).get('id');
  const content = document.getElementById('content');
  const btnScript = document.getElementById('btnCopyScript');
  const btnTitleScript = document.getElementById('btnCopyTitleScript');
  if (!id) { content.innerHTML = '<div class="hint">缺少资产 id 参数。</div>'; return; }
  content.innerHTML = '<div class="hint">加载中…</div>';
  btnScript.disabled = true;
  btnTitleScript.disabled = true;
  let r;
  try {
    const resp = await fetch('/api/assets/' + encodeURIComponent(id) + '/source');
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
    r = data;
  } catch (e) {
    content.innerHTML = `<div class="hint">加载失败:${esc(e.message)}<br><br><button class="ghost" onclick="load()">重试</button></div>`;
    return;
  }
  document.title = '原文对照 · ' + (r.name || r.id);
  document.getElementById('title').textContent = r.name || r.id;
  renderSubtitle(r);
  // 逐条取英文正文,单空格连接;折叠多余空白(源 SRT 每条已是单行)
  scriptText = (r.cues || [])
    .map(c => String(c.en || '').trim())
    .filter(Boolean)
    .join(' ')
    .replace(/\s+/g, ' ')
    .trim();
  btnScript.disabled = !scriptText;
  btnTitleScript.disabled = !scriptText;
  content.innerHTML = r.cues.map(c =>
    `<div class="cue"><span class="time">${fmtT(c.start)} → ${fmtT(c.end)}</span>` +
    `<span class="en">${esc(c.en)}</span><span class="zh">${esc(c.zh || '')}</span></div>`
  ).join('') || '<div class="hint">无内容。</div>';
  document.getElementById('total').textContent = `共 ${r.cues.length} 条`;
}
load();
</script>
</body>
</html>
